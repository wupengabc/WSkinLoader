plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Keep client sources in main so the existing cache tests share its classpath.
sourceSets {
    main {
        java.srcDir "src/client/java"
        resources.srcDir "src/client/resources"
    }
}

loom {
    mods {
        "wskinloader" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            programArgs "--username", "wupengabc"
        }
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.terraformersmc.com/releases/" }
    // 镜像兜底：Gradle 自带的 HTTP 客户端在部分网络下对 Mojang / Central
    // 的 TLS 握手会失败，这里提供可用的镜像源。
    maven { url "https://bmclapi2.bangbang93.com/maven/" }
    maven { url "https://maven.aliyun.com/repository/public" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // ModMenu
    modImplementation "com.terraformersmc:modmenu:6.3.1"

    testImplementation "junit:junit:4.13.2"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE.txt") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
